name: Release

# Pushing a tag such as v0.3.0 publishes a GitHub release with the agents for every platform. The tag
# must match VersionPrefix in Directory.Build.props, so builds from the tagged source carry the same
# version. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        run: |
          version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match VersionPrefix $version in Directory.Build.props."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: build/package-agent.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          To upgrade a server, see [Upgrade](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/deployment.md#upgrade). Once the server runs $version, agents can be updated from the Hosts page.
          EOF
          cd artifacts/agent
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Argus $version" \
            --notes-file ../../notes.md --generate-notes \
            argus-agent-* SHA256SUMS
