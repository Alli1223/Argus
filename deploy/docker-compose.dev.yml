# Dependencies for running the Argus server locally with `dotnet run`.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Mailpit catches the server's emails; read them at http://localhost:8025.
#
name: argus-dev

services:
  db:
    image: timescale/timescaledb:2.30.0-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
