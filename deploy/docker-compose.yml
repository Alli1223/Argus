# Argus in production: the server (with the web app and agent downloads), TimescaleDB, the updater
# that installs new releases from the web app, and optionally Caddy in front for automatic HTTPS.
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   docker compose -f deploy/docker-compose.yml up -d
#
# See docs/deployment.md.
name: argus

services:
  db:
    image: timescale/timescaledb:2.30.0-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - argus

  server:
    # The release in ARGUS_VERSION; the updater changes it there when it installs another.
    image: ${ARGUS_IMAGE:-ghcr.io/alli1223/argus}:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Argus: Host=db;Database=argus;Username=argus;Password=${POSTGRES_PASSWORD}
      Argus__PublicUrl: ${ARGUS_PUBLIC_URL:-}
      Argus__Auth__AllowRegistration: ${ARGUS_ALLOW_REGISTRATION:-false}
      Argus__Smtp__Host: ${ARGUS_SMTP_HOST:-}
      Argus__Smtp__Port: ${ARGUS_SMTP_PORT:-587}
      Argus__Smtp__Security: ${ARGUS_SMTP_SECURITY:-Auto}
      Argus__Smtp__Username: ${ARGUS_SMTP_USERNAME:-}
      Argus__Smtp__Password: ${ARGUS_SMTP_PASSWORD:-}
      Argus__Smtp__From: ${ARGUS_SMTP_FROM:-}
      # X-Forwarded-* headers are believed from Caddy's fixed address, and from nobody else.
      Argus__Proxy__TrustedProxies__0: 172.30.0.10
      Argus__Updates__ServerUpdatesDirectory: /updates
    ports:
      - "${ARGUS_HTTP_BIND:-8080}:8080"
    volumes:
      - updates:/updates
    networks:
      - argus

  # Installs the releases administrators choose in the web app: it backs up the database, starts the
  # new server and goes back to the old one if that does not come up. Doing so takes Docker itself,
  # which is as good as root on this machine, so the updater has no network and no ports, and the server
  # can only ask it for a release by its version number. Remove this service to update by hand instead.
  updater:
    image: ${ARGUS_UPDATER_IMAGE:-ghcr.io/alli1223/argus-updater}:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # This directory, for the Compose files, .env and backups/. It has to be mounted at /deploy.
      - .:/deploy
      - updates:/updates

  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      ARGUS_DOMAIN: ${ARGUS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      argus:
        ipv4_address: 172.30.0.10

networks:
  argus:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  updates:
  caddy-data:
  caddy-config:
